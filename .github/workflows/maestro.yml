name: Maestro E2E

on:
  push:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".maestro/**"
      - ".github/workflows/maestro.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".maestro/**"
      - ".github/workflows/maestro.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: 'Android Build'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - run: chmod +x ./gradlew
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug
        env:
          OTTJNI_SKIP_NIX: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1

  test:
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            profile: "pixel_6"
            api: 34
          - shard: 1
            profile: "pixel_2"
            api: 28
          - shard: 2
            profile: "pixel_xl"
            api: 30
          - shard: 3
            profile: "pixel_4"
            api: 33
          - shard: 4
            profile: "Nexus 5X"
            api: 26
          - shard: 5
            profile: "pixel_5"
            api: 31
          - shard: 6
            profile: "pixel_3"
            api: 29
          - shard: 7
            profile: "pixel_7"
            api: 34
          - shard: 8
            profile: "pixel_4_xl"
            api: 32
          - shard: 9
            profile: "pixel_3a"
            api: 27
    name: "shard ${{ matrix.shard }} (${{ matrix.profile }}, API ${{ matrix.api }})"
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Compute test order
        id: order
        run: |
          # Run the full suite on each emulator profile so every test exercises
          # every device. Shuffle order per shard (deterministic seed) so
          # different shards exercise different test orderings, surfacing any
          # state leakage between flows.
          # Skip 00_seed_test_data.yaml (helper, never run alone) and
          # 02_login_happy_path.yaml (needs real Apple creds).
          ls .maestro/*.yaml \
            | grep -v '00_seed_test_data\.yaml$' \
            | grep -v '02_login_happy_path\.yaml$' \
            | sort \
            | shuf --random-source=<(yes "shard${{ matrix.shard }}" | head -c 4096) \
            > shard_files.txt
          echo "Shard ${{ matrix.shard }} will run $(wc -l < shard_files.txt) tests:"
          cat shard_files.txt

      - name: Boot emulator and run Maestro shard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6144M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r apk/androidApp-debug.apk
            FAIL=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "::group::maestro $file"
              if ! maestro test "$file"; then
                FAIL=1
                echo "::error file=$file::Maestro flow failed"
              fi
              echo "::endgroup::"
            done < shard_files.txt
            exit $FAIL

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-shard-${{ matrix.shard }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: ignore
