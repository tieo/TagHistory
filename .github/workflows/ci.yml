name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - ".maestro/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - ".maestro/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: 'Android Build'
    outputs:
      apk-path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      - name: Build APK + run unit tests in container (same image local devs use)
        run: |
          docker compose build build
          docker compose run --rm \
            -v ${HOME}/.gradle:/root/.gradle \
            build \
            ./gradlew test :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1

  test:
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            device: "Samsung Galaxy S10"
            android: "13.0"
            tag: "emulator_13.0"
          - shard: 1
            device: "Nexus 5"
            android: "11.0"
            tag: "emulator_11.0"
          - shard: 2
            device: "Samsung Galaxy S9"
            android: "12.0"
            tag: "emulator_12.0"
          - shard: 3
            device: "Nexus 7"
            android: "10.0"
            tag: "emulator_10.0"
          - shard: 4
            device: "Samsung Galaxy S6"
            android: "9.0"
            tag: "emulator_9.0"
          - shard: 5
            device: "Nexus One"
            android: "8.1"
            tag: "emulator_8.1"
          - shard: 6
            device: "Samsung Galaxy S10"
            android: "13.0"
            tag: "emulator_13.0"
          - shard: 7
            device: "Pixel 6"
            android: "13.0"
            tag: "emulator_13.0"
          - shard: 8
            device: "Samsung Galaxy S9"
            android: "12.0"
            tag: "emulator_12.0"
          - shard: 9
            device: "Nexus 5"
            android: "11.0"
            tag: "emulator_11.0"
    name: "shard ${{ matrix.shard }} (${{ matrix.device }} / Android ${{ matrix.android }})"
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/

      - name: Compute test order for this shard
        run: |
          ls .maestro/*.yaml \
            | grep -v '00_seed_test_data\.yaml$' \
            | grep -v '02_login_happy_path\.yaml$' \
            | sort \
            | shuf --random-source=<(yes "shard${{ matrix.shard }}" | head -c 4096) \
            > shard_files.txt
          echo "Shard ${{ matrix.shard }} on ${{ matrix.device }} (Android ${{ matrix.android }}) will run:"
          cat shard_files.txt

      - name: Run Maestro shard in container
        env:
          EMULATOR_DEVICE: ${{ matrix.device }}
          EMULATOR_VERSION: ${{ matrix.android }}
          EMULATOR_TAG: ${{ matrix.tag }}
        run: |
          # Map shard list to absolute paths the container will see.
          mapfile -t TESTS < shard_files.txt
          MAPPED=()
          for f in "${TESTS[@]}"; do
            MAPPED+=("/tests/$(basename "$f")")
          done
          docker compose build maestro
          docker compose run --rm \
            -e EMULATOR_DEVICE \
            -e EMULATOR_VERSION \
            maestro "${MAPPED[@]}"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-shard-${{ matrix.shard }}
          path: |
            ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: ignore
