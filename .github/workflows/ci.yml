name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - ".maestro/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "gradlew"
      - ".maestro/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: 'Android Build'
    outputs:
      apk-path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      - name: Build APK + run unit tests in container
        run: |
          docker compose build build
          docker compose run --rm \
            -v ${HOME}/.gradle:/root/.gradle \
            build \
            ./gradlew test :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 1

  test:
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            api: 34
            arch: x86_64
            profile: pixel_6
          - shard: 1
            api: 34
            arch: x86_64
            profile: pixel_6
          - shard: 2
            api: 34
            arch: x86_64
            profile: pixel_6
          - shard: 3
            api: 34
            arch: x86_64
            profile: pixel_6
    name: "shard ${{ matrix.shard }} (API ${{ matrix.api }})"
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Compute test slice for this shard (4-way split)
        run: |
          ls .maestro/*.yaml \
            | grep -v '00_seed_test_data\.yaml$' \
            | grep -v '02_login_happy_path\.yaml$' \
            | sort \
            | awk -v shard=${{ matrix.shard }} 'NR % 4 == shard' \
            > shard_files.txt
          echo "Shard ${{ matrix.shard }} will run $(wc -l < shard_files.txt) flow(s):"
          cat shard_files.txt

      - name: Boot emulator and run Maestro shard
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 35
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 1024M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r apk/androidApp-debug.apk
            FAIL=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "::group::maestro $file"
              if ! maestro test "$file"; then
                FAIL=1
                echo "::error file=$file::Maestro flow failed"
              fi
              echo "::endgroup::"
            done < shard_files.txt
            exit $FAIL

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-shard-${{ matrix.shard }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: ignore
