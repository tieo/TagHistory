name: Generate APK (Debug)
env:
  main_project_module: androidApp
  app_name: TagHistory

on:
  push:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"
  pull_request:
    branches: [ "main" ]
    paths:
      - "androidApp/**"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "settings.gradle.kts"

  workflow_dispatch:

jobs:
  build:
    environment: 'Android Build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inject secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY || 'maps_key_default_value' }}" > secrets.properties

      - name: Run gradle tests
        run: ./gradlew test
        env:
          OTTJNI_SKIP_NIX: "1"

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug
        env:
          OTTJNI_SKIP_NIX: "1"

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) debug generated
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/
