[versions]
# ---------------------------------------------------------------
# KMP + Compose MP foundation
# Versions chosen to match the locally-cached artifact set so the
# offline build works. If you change these, make sure the artifact
# exists under ~/.gradle/caches/modules-2/files-2.1 or on a reachable
# maven repo — the build runs with --offline in sandboxed sessions.
# ---------------------------------------------------------------
kotlin = "2.3.0"
composeMultiplatform = "1.10.0"
coroutines = "1.10.2"
serialization = "1.9.0"
ktor = "3.3.3"
sqldelight = "2.1.0"
koin = "4.0.0"
cryptographyKotlin = "0.4.0"
multiplatformSettings = "1.2.0"
lifecycleKmp = "2.9.4"

# ---------------------------------------------------------------
# Android toolchain / legacy Java app (being phased out)
# ---------------------------------------------------------------
agp = "9.1.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.1"
lifecycleLivedataKtx = "2.10.0"
lifecycleViewmodelKtx = "2.10.0"
navigationFragment = "2.9.7"
navigationUi = "2.9.7"
maplibre = "11.6.1"
roomVersion = "2.8.4"
gradleLombokVersion = "5.0.0"
lombokVersion = "1.18.36"
jacksonVersion = "2.18.3"
googleCodePlist = "1.28"
jsonSchemaValidator = "1.5.6"
activity = "1.13.0"
activityCompose = "1.13.0"
androidDatastore = "1.1.3"
rxJavaVer = "3.0.2"
annotation = "1.10.0"
googlePlayServicesLocation = "21.3.0"
desugarJdkLibs = "2.1.5"
emojiPicker = "1.5.0"
workManager = "2.11.2"
bouncycastle = "1.78.1"
guava = "33.4.6-android"
ktlint = "14.2.0"

[libraries]
# ---------------------------------------------------------------
# KMP core
# ---------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Used only in JVM-targeting test source sets (androidUnitTest, desktopTest). Not in commonTest.
kotlinx-coroutines-test-jvm = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test-jvm", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Ktor HTTP client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
# mock-jvm only — the multiplatform `ktor-client-mock` metadata is not in the offline cache,
# so we scope mock usage to JVM-only test source sets (androidUnitTest, desktopTest).
ktor-client-mock-jvm = { group = "io.ktor", name = "ktor-client-mock-jvm", version.ref = "ktor" }

# SQLDelight
sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { group = "app.cash.sqldelight", name = "native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { group = "app.cash.sqldelight", name = "sqlite-driver", version.ref = "sqldelight" }
sqldelight-web-worker-driver = { group = "app.cash.sqldelight", name = "web-worker-driver", version.ref = "sqldelight" }
sqldelight-async-coroutines-extensions = { group = "app.cash.sqldelight", name = "async-extensions", version.ref = "sqldelight" }

# Koin (core only — android/compose bindings not in local cache, wired manually on android)
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }

# cryptography-kotlin — JDK provider on android+desktop; iOS has no provider yet in offline set,
# so iosMain uses a throw-from-actual stub that never reaches production today.
cryptography-kotlin-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "cryptographyKotlin" }
cryptography-kotlin-provider-jdk = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-jdk", version.ref = "cryptographyKotlin" }

# KotlinCrypto — pure-Kotlin SHA-256 + HMAC-SHA-256 used by the wasmJs
# crypto actuals. Browser crypto.subtle is async-only; sticking with a
# pure-Kotlin port keeps the existing sync expect signatures intact.
kotlincrypto-sha2 = { group = "org.kotlincrypto.hash", name = "sha2", version = "0.8.0" }
kotlincrypto-hmac-sha2 = { group = "org.kotlincrypto.macs", name = "hmac-sha2", version = "0.8.0" }

# Pure-Kotlin AES-128 block cipher — pairs with the in-tree CBC + GCM
# wrappers in wasmJsMain. Same sync contract as the JVM `javax.crypto`
# actuals so the existing aesCbcDecryptPkcs7 / aesGcmDecrypt expects
# stay non-suspend.
kotlinx-crypto-aes = { group = "io.github.andreypfau", name = "kotlinx-crypto-aes", version = "0.0.4" }

# Pure-Kotlin BigInteger so the wasm BigInt actual can forward to a
# real arbitrary-precision arithmetic implementation. Used by the
# P-224 EC math in wasmJsMain.
ionspin-bignum = { group = "com.ionspin.kotlin", name = "bignum", version = "0.3.10" }

# multiplatform-settings — expect/actual preferences; datastore binding not cached so
# Android uses the in-memory MapSettings + SharedPreferences impl.
multiplatform-settings = { group = "com.russhwolf", name = "multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { group = "com.russhwolf", name = "multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }

# AndroidX Lifecycle KMP artifacts — shared ViewModel base + scope.
# The `lifecycle-viewmodel` module resolves to per-target artifacts at
# build time; all variants are in the local cache at 2.10.0.
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleKmp" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKmp" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleKmp" }

# ---------------------------------------------------------------
# Android / Compose host
# ---------------------------------------------------------------
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---------------------------------------------------------------
# Legacy Android (keeping these until the Java app/ module is deleted in Phase 16)
# ---------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigationUi" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
android-room = { group = "androidx.room", name = "room-runtime", version.ref = "roomVersion" }
android-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomVersion" }
android-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomVersion" }
android-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "roomVersion" }
projectlombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombokVersion" }
fasterxml-jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jacksonVersion" }
fasterxml-jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jacksonVersion" }
fasterxml-jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jacksonVersion" }
fasterxml-jackson-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jacksonVersion" }
googlecode-plist = { group = "com.googlecode.plist", name = "dd-plist", version.ref = "googleCodePlist" }
networknt-json-schema-validator = { group = "com.networknt", name = "json-schema-validator", version.ref = "jsonSchemaValidator" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
rxjava3 = { group = "io.reactivex.rxjava3", name = "rxandroid", version.ref = "rxJavaVer" }
datastore-prefs = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidDatastore" }
datastore-prefs-rxjava3 = { group = "androidx.datastore", name = "datastore-preferences-rxjava3", version.ref = "androidDatastore" }
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidDatastore" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
google-play-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "googlePlayServicesLocation" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-emoji = { group = "androidx.emoji2", name = "emoji2", version.ref = "emojiPicker" }
androidx-emoji-views = { group = "androidx.emoji2", name = "emoji2-views", version.ref = "emojiPicker" }
androidx-emoji-views-helper = { group = "androidx.emoji2", name = "emoji2-views-helper", version.ref = "emojiPicker" }
androidx-emoji-picker = { group = "androidx.emoji2", name = "emoji2-emojipicker", version.ref = "emojiPicker" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workManager" }
# Pinned to bump core to a fully-cached version; work-runtime's default
# (androidx.core:1.12.0) only has pom+module in the offline cache.
androidx-core = { group = "androidx.core", name = "core", version = "1.18.0" }
# Same problem: work-runtime:2.11.2 transitively pulls room:2.7.0 which
# isn't cached. Pin to 2.8.4 (already used by the legacy app/ module).
androidx-room-runtime-pinned = { group = "androidx.room", name = "room-runtime", version = "2.8.4" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
gradle-lombok = { id = "io.franzbecker.gradle-lombok", version.ref = "gradleLombokVersion" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
