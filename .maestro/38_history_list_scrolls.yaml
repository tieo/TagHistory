appId: io.github.tieo.taghistory
name: History — list scrolls without crashing across day switches
---
# Car Keys has 6 reports across 3 days. Sheet is fixed at peek; today's
# items 0 and 1 are visible immediately. The list inside scrolls
# without expanding the sheet (covered separately by flow 62); this
# flow exercises a few burst scrolls + a day switch and asserts the
# screen stays alive.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

# Burst of scrolls inside the sheet's peek slice — list scrolls but
# the screen survives.
- swipe:
    start: "50%, 95%"
    end: "50%, 80%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 95%"
    end: "50%, 80%"
    duration: 400
- swipe:
    start: "50%, 80%"
    end: "50%, 95%"
    duration: 400

# Summary still rendered (peek didn't break).
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*At \\d.*"
    timeout: 25000

# Day-prev to Yesterday: the list re-renders with Yesterday's points.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "history_item_0"
