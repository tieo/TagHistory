appId: io.github.tieo.taghistory
name: History — basemap cycle button cycles through light/dark/satellite
---
# BasemapCycleButton has contentDescription "Basemap: <state>". Cycling
# advances LIGHT -> DARK -> SATELLITE -> LIGHT.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000

# Find the button (one of the three states). Tap it to cycle. We don't
# assume the starting state because it follows the system theme.
- extendedWaitUntil:
    visible:
      text: "Basemap: .*"
    timeout: 25000
- tapOn:
    text: "Basemap: .*"
- extendedWaitUntil:
    visible:
      text: "Basemap: .*"
    timeout: 25000
- tapOn:
    text: "Basemap: .*"
- extendedWaitUntil:
    visible:
      text: "Basemap: .*"
    timeout: 25000
- tapOn:
    text: "Basemap: .*"

# After three cycles we should be back at the original. Verify map screen
# is still alive and day controls are still rendering.
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Cycle three more times — full second loop. Day controls remain alive.
- tapOn:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Day-prev → Yesterday: cycling basemap doesn't break day nav state.
- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    text: "Basemap: .*"
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
