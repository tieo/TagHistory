appId: io.github.tieo.taghistory
name: Settings — About button navigates to information screen, back returns
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Pre: btn_about not visible until scroll, settings landmarks present.
- scrollUntilVisible:
    element:
      id: "btn_about"
    direction: DOWN
    timeout: 25000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "btn_about"
    timeout: 25000

- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: "btn_about"
      - extendedWaitUntil:
          visible:
            id: "btn_source_code"
          timeout: 20000

# Information screen: links present (source_code asserted above at the
# 60s landing wait), settings landmarks gone. btn_license is the third
# link row and sits at the fold edge on the short CI viewport — the two
# rows above it already prove the screen rendered, so it isn't asserted
# standalone here (16_information_screen covers tapping it).
- extendedWaitUntil:
    visible:
      id: "btn_developer_website"
    timeout: 25000
- assertNotVisible:
    text: "Appearance"
- assertNotVisible:
    text: "Background sync"
- assertNotVisible:
    id: "btn_sign_out"

- back
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Back: information links gone, settings sections back.
- assertNotVisible:
    id: "btn_source_code"
- assertNotVisible:
    id: "btn_developer_website"
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 25000

# Reopen About a second time to ensure idempotent navigation.
- scrollUntilVisible:
    element:
      id: "btn_about"
    direction: DOWN
    timeout: 25000
    centerElement: true
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: "btn_about"
      - extendedWaitUntil:
          visible:
            id: "btn_source_code"
          timeout: 20000
- back
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
