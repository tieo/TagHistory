appId: io.github.tieo.taghistory
name: History — navigating past the oldest seeded day still keeps controls alive
---
# Car Keys is seeded with 3 distinct days. Pressing prev 3 times should
# either land on a date label (older days exist via fetch_older) or stay
# on the oldest available bucket. Either way, the controls stay alive.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Three back-presses on day-prev — tries to walk past the oldest seed
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true

# Day-next icon is still present (history screen alive)
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000

# Walk forward all the way back to Today.
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Today seeded with 3 items — list is non-empty.
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000

# Walk past the end again, then forward — the boundary holds without crash.
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"

# Run the same boundary stress on Bike (1 report only — only Today bucket).
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
