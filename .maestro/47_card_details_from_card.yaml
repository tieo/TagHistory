appId: io.github.tieo.taghistory
name: Map — tapping btn_card_details opens DeviceInfo for that card
---
# Verifies the details circle action works for each card. After back,
# the same beacon name is still selected.
- runFlow:
    file: 00_seed_test_data.yaml

- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_card_history"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_rename"

# Repeat for Backpack and Bike — details opens fresh for each card.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
