appId: io.github.tieo.taghistory
name: Map — per-row details action opens DeviceInfo for that beacon
---
# Verifies each row's details circle action opens DeviceInfo for the
# RIGHT beacon (name shown on details matches the row tapped), and
# back lands on the intact list every time.
- runFlow:
    file: 00_seed_test_data.yaml

- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_rename"

# Backpack — details opens fresh with the right beacon.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# Bike
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# List resets to top after back; swipe down to confirm Bike survived.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
