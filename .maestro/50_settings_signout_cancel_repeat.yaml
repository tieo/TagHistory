appId: io.github.tieo.taghistory
name: Settings — sign-out cancel ×3 keeps user on settings (regression)
---
# Opens the sign-out dialog and cancels three times. After every cancel the
# btn_sign_out button must still be tappable (no double-confirm latch, no
# accidental navigation away from Settings).
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000

# round 1
- scrollUntilVisible:
    element:
      id: "btn_sign_out"
    direction: DOWN
    timeout: 5000
# Dialog buttons render in a separate window — must use text selectors
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 5000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 2
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 5000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 3
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 5000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
