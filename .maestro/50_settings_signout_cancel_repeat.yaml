appId: io.github.tieo.taghistory
name: Settings — sign-out cancel ×3 keeps user on settings (regression)
---
# Opens the sign-out dialog and cancels three times. After every cancel the
# btn_sign_out button must still be tappable (no double-confirm latch, no
# accidental navigation away from Settings).
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 15000

# round 1
- scrollUntilVisible:
    element:
      id: "btn_sign_out"
    direction: DOWN
    timeout: 15000
# Dialog buttons render in a separate window — must use text selectors
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 2
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 3
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 4: cancel via system back instead of Cancel button.
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- back
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# round 5: open and cancel one more time to be thorough.
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- assertVisible:
    id: "btn_sign_out"

# Back to map: still authenticated, still on map screen.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Welcome to TagHistory"

# One more pass: open Settings again, scroll, sign-out dialog still works.
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "btn_sign_out"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 15000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
