appId: io.github.tieo.taghistory
name: Settings — full theme cycle System -> Light -> Dark -> System
---
# Walks the whole tri-state theme picker. After every step we verify the
# settings screen is still alive (recompose didn't blow up) and the new
# choice is selectable. Final state restores the default.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000

# System -> Light
- tapOn:
    id: "btn_theme_light"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_light"

# Light -> Dark
- tapOn:
    id: "btn_theme_dark"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_dark"

# Dark -> System (restore)
- tapOn:
    id: "btn_theme_system"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_system"

# Round 2: System -> Dark -> Light -> System (reverse direction).
- tapOn:
    id: "btn_theme_dark"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_dark"
- assertVisible:
    id: "btn_theme_light"
- assertVisible:
    id: "btn_theme_system"

- tapOn:
    id: "btn_theme_light"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_light"

- tapOn:
    id: "btn_theme_system"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_system"

# Persistence: leave Settings, go to Map, come back; theme picker still works.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Car Keys"
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 5000
- assertVisible:
    id: "btn_theme_system"
- tapOn:
    id: "btn_theme_dark"
- assertVisible:
    id: "btn_theme_dark"
- tapOn:
    id: "btn_theme_system"

# Back to map ends in known state.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Car Keys"
