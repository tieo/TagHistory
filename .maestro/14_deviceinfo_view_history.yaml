appId: io.github.tieo.taghistory
name: Device info — View history button navigates to history screen
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 5000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_fetch_older"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 5000
