appId: io.github.tieo.taghistory
name: Device info — View history button navigates to history; back returns
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
# Pre: details landmarks on screen, history-screen widgets not yet visible.
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"

- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000

# History screen: day-nav controls present, details widgets gone, map widgets gone.
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
- assertNotVisible:
    id: "btn_rename"
- assertNotVisible:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Back to details — view-history button is back, day-nav gone.
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"

# Reopen history a second time, verify symmetry.
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000

# Final back to map.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
