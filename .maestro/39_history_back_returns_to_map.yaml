appId: io.github.tieo.taghistory
name: History — back from history returns to map (btn_settings reappears)
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000

# btn_settings is part of map screen and should not be visible while history
# screen is up
- assertNotVisible:
    id: "btn_settings"

- back

- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    id: "btn_settings"
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    id: "btn_day_prev"
- assertNotVisible:
    id: "btn_day_next"
- assertNotVisible:
    text: "Today"

# Re-enter history a second time, verify same flow works again.
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_card_details"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    id: "btn_day_prev"

# Swipe to Backpack and verify same back-flow on a different beacon.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 5000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Backpack"
