appId: io.github.tieo.taghistory
name: Settings screen — all section headers visible and reachable by scroll
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Top of settings: top sections visible.
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Background sync"
    timeout: 25000
# Bottom sections not yet visible without scroll.
- assertNotVisible:
    text: "About"

# Scroll down: Account/About become visible. (The Advanced section was
# removed along with the in-app sync-log panel — logs are logcat-only now.)
# Use scrollUntilVisible, not a fixed swipe: the Background-sync section's
# height varies (a battery-optimization warning may render), so a single
# swipe isn't guaranteed to reveal the bottom sections.
- scrollUntilVisible:
    element:
      text: "Account"
    direction: DOWN
    timeout: 25000
    centerElement: true
- scrollUntilVisible:
    element:
      text: "About"
    direction: DOWN
    timeout: 25000
    centerElement: true

# btn_about and btn_sign_out exist by ID near the bottom.
- extendedWaitUntil:
    visible:
      id: "btn_about"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_sign_out"
    timeout: 25000

# Scroll back to the top — Appearance returns to view.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: UP
    timeout: 25000
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000

# Round-trip back to map.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Appearance"
