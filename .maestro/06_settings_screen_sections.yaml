appId: io.github.tieo.taghistory
name: Settings screen — all section headers visible and reachable by scroll
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Top of settings: top sections visible.
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Background sync"
    timeout: 25000
# Bottom sections not yet visible without scroll.
- assertNotVisible:
    text: "About"

# Scroll down: Advanced/Account/About become visible.
- swipe:
    direction: UP
    duration: 600
- extendedWaitUntil:
    visible:
      text: "Advanced"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 25000

# btn_about and btn_sign_out exist by ID near the bottom.
- extendedWaitUntil:
    visible:
      id: "btn_about"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_sign_out"
    timeout: 25000

# Scroll back to the top — Appearance returns to view.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: UP
    timeout: 25000
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000

# Round-trip back to map.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Appearance"
