appId: io.github.tieo.taghistory
name: Settings — debug panel populates with real sync events when Refresh fires
---
- runFlow:
    file: 00_seed_test_data.yaml

# Initial nav: open settings, panel must be hidden by default.
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Show debug data"
    timeout: 25000
- assertNotVisible:
    id: "sync_log_header"
- assertNotVisible:
    id: "btn_clear_sync_log"

# Toggle on. Header + clear visible. The MapViewModel boots a refresh on
# launch, so the log already has events from that. Clear it to start
# from a known empty state.
- tapOn:
    text: "Show debug data"
- extendedWaitUntil:
    visible:
      id: "sync_log_header"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "sync_log_header"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_clear_sync_log"
    timeout: 25000

- tapOn:
    id: "btn_clear_sync_log"
- extendedWaitUntil:
    visible:
      text: ".*No sync events yet.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*No sync events yet.*"
    timeout: 25000
- assertNotVisible:
    text: "START"

# Press Refresh now. Refresh routes through MapViewModel so SyncLog
# records START / RUNG_OK / REFRESH_DONE.
- tapOn:
    id: "btn_refresh_now"

# After refresh fires, START must always appear (logged unconditionally
# in MapViewModel.refreshCascade so the user sees the press, even when
# a previous refresh is still in flight and the new cascade short-circuits).
- extendedWaitUntil:
    visible:
      text: "START"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "START"
    timeout: 25000

# Either RUNG_OK / RUNG_FAIL (cascade ran) or INFO (cascade skipped because
# a previous refresh is still in flight). Both prove the refresh path was
# entered.
- extendedWaitUntil:
    visible:
      text: ".*(RUNG|INFO).*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*Refresh started.*"
    timeout: 25000

# Time format must be HH:MM:SS, not the YYYY-MM-DDTHH:mm ISO from the
# broken first attempt.
- extendedWaitUntil:
    visible:
      text: "^\\d\\d:\\d\\d:\\d\\d$"
    timeout: 25000

# Clear empties the log back to the hint.
- tapOn:
    id: "btn_clear_sync_log"
- extendedWaitUntil:
    visible:
      text: ".*No sync events yet.*"
    timeout: 25000
- assertNotVisible:
    text: "START"

# Toggling debug off hides the whole panel; the switch state is per-app
# session so no need to reset.
- tapOn:
    text: "Show debug data"
- extendedWaitUntil:
    visible:
      text: "Show debug data"
    timeout: 25000
- assertNotVisible:
    id: "sync_log_header"
- assertNotVisible:
    id: "btn_clear_sync_log"
