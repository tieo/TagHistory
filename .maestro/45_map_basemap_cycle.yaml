appId: io.github.tieo.taghistory
name: Map — basemap cycle button advances LIGHT/DARK/SATELLITE/LIGHT
---
# BasemapCycleButton on map screen has contentDescription "Basemap: <state>".
# Cycle three times and verify the map and pager are still alive.
- runFlow:
    file: 00_seed_test_data.yaml

- assertVisible:
    text: "Basemap: .*"

# Three taps -> back to original basemap.
- tapOn:
    text: "Basemap: .*"
- assertVisible:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"
- assertVisible:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"

# Map and card still alive.
- assertVisible:
    text: "Car Keys"
- assertVisible:
    id: "btn_card_history"
- assertVisible:
    id: "btn_settings"

# Cycle three more times — full second loop.
- tapOn:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"
- tapOn:
    text: "Basemap: .*"
- assertVisible:
    text: "Basemap: .*"

# Swipe between cards while the chosen basemap stays applied. Card pager
# must still respond and the basemap button is still on screen.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- assertVisible:
    text: "Basemap: .*"
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 15000
- assertVisible:
    text: "Basemap: .*"

# Cycle once more on Bike, swipe back to Car Keys, basemap still rendered.
- tapOn:
    text: "Basemap: .*"
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 15000
- assertVisible:
    text: "Basemap: .*"
