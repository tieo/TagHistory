appId: io.github.tieo.taghistory
name: History — map polyline actually re-renders when day arrows are tapped
---
- runFlow:
    file: 00_seed_test_data.yaml

# Car Keys: today=3 points, yesterday=2, 3 days ago=1.
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "map_render_3"
    timeout: 4000
- assertVisible:
    id: "map_render_3"

- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "map_render_2"
    timeout: 2000
- assertVisible:
    id: "map_render_2"

- tapOn:
    id: "btn_day_next"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "map_render_3"
    timeout: 2000
- assertVisible:
    id: "map_render_3"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 4000
