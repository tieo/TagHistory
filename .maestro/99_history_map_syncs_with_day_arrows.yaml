appId: io.github.tieo.taghistory
name: History — map re-renders when day arrows are tapped
---
# The history map exposes a map_render_<pointCount> testTag that updates
# every time HistoryMapView.onRendered fires. Exact counts are
# data/timezone-sensitive (the "today" range can pick up a boundary
# point), so this asserts the render tag is present (onRendered fired)
# on each day AND that the day label transitions — together that proves
# the map re-rendered in response to day navigation, not the brittle
# exact point count it used to hardcode.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "map_render_.*"
    timeout: 25000

- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "map_render_.*"
    timeout: 25000

- tapOn:
    id: "btn_day_next"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "map_render_.*"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
