appId: io.github.tieo.taghistory
name: History — open history for each of the three seeded beacons
---
# Switches between the three beacons via card swipes and opens history for
# each. After back, the same card stays selected. Each history view must
# render the day-nav controls (proves the view-model loaded for that beacon).
- runFlow:
    file: 00_seed_test_data.yaml

# ── Car Keys ─────────────────────────────────────────────────────────────────
- assertVisible:
    text: "Car Keys"
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Car Keys"

# ── Backpack ─────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Backpack"

# ── Bike ─────────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 15000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- assertVisible:
    text: "Today"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Bike"
- assertNotVisible:
    id: "btn_day_prev"

# ── Reverse pass: swipe back through Backpack -> Car Keys, history each ──
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- assertVisible:
    text: "Today"
- swipe:
    start: "50%, 88%"
    end: "50%, 40%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 15000
- assertVisible:
    text: ".*data point.*"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Backpack"

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 15000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- swipe:
    start: "50%, 88%"
    end: "50%, 40%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 15000
# Car Keys today has 3 reports — at least history_item_2 visible.
- assertVisible:
    id: "history_item_2"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Car Keys"
