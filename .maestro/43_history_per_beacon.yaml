appId: io.github.tieo.taghistory
name: History — open history for each of the three seeded beacons
---
# Switches between the three beacons via card swipes and opens history for
# each. After back, the same card stays selected. Each history view must
# render the day-nav controls (proves the view-model loaded for that beacon).
- runFlow:
    file: 00_seed_test_data.yaml

# ── Car Keys ─────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── Backpack ─────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# ── Bike ─────────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"

# ── Reverse pass: swipe back through Backpack -> Car Keys, history each ──
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
# Car Keys today has 3 reports — at least history_item_2 visible.
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
