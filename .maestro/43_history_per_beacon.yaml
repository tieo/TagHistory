appId: io.github.tieo.taghistory
name: History — open history for each of the three seeded beacons
---
# Switches between the three beacons via card swipes and opens history for
# each. After back, the same card stays selected. Each history view must
# render the day-nav controls (proves the view-model loaded for that beacon).
- runFlow:
    file: 00_seed_test_data.yaml

# ── Car Keys ─────────────────────────────────────────────────────────────────
- assertVisible:
    text: "Car Keys"
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Car Keys"

# ── Backpack ─────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 5000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Backpack"

# ── Bike ─────────────────────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 5000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Bike"
