appId: io.github.tieo.taghistory
name: Login — Start over returns to credentials screen
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000

- tapOn:
    id: "field_email"
- inputText: "test@example.com"
- tapOn:
    id: "field_password"
- inputText: "wrongpassword"
- tapOn:
    id: "btn_login"

# If Start over appears (error path), exercise it twice to confirm
# the credentials screen restores idempotently with empty/clean fields.
- runFlow:
    when:
      visible:
        id: "btn_start_over"
    commands:
      # On the OTP/2FA screen the credentials widgets must be hidden.
      - assertNotVisible:
          id: "field_password"
      - assertNotVisible:
          id: "btn_login"

      # First Start over: OTP-screen widgets disappear, credentials reappear.
      - tapOn:
          id: "btn_start_over"
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_password"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_login"
          timeout: 25000
      - assertNotVisible:
          id: "btn_start_over"
      - assertNotVisible:
          id: "field_otp_code"

      # Welcome banner must still read the same text.
      - extendedWaitUntil:
          visible:
            text: "Welcome to TagHistory"
          timeout: 25000

      # Second attempt loops back to the same OTP/2FA screen and back again.
      - tapOn:
          id: "field_email"
      - eraseText: 50
      - inputText: "second@example.com"
      - tapOn:
          id: "field_password"
      - eraseText: 50
      - inputText: "wrongpassword2"
      - tapOn:
          id: "btn_login"
      - runFlow:
          when:
            visible:
              id: "btn_start_over"
          commands:
            - tapOn:
                id: "btn_start_over"
            - extendedWaitUntil:
                visible:
                  id: "field_email"
                timeout: 25000
            - assertNotVisible:
                id: "btn_start_over"
