appId: io.github.tieo.taghistory
name: "Stress: map→details→history→back×2 — full back-stack depth"
---
# Drills two levels deep (details then history via btn_view_history) and unwinds
# one level at a time. Verifies the back-stack has exactly the right depth — one
# extra back would skip details and land on the map, the wrong assertion catches it.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Descend from Car Keys: map → details → history ────────────────────
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000

# ── Unwind level 1: history → details ─────────────────────────────────
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
# Must be on details, not map
- assertNotVisible:
    id: "btn_settings"

# ── Unwind level 2: details → map ─────────────────────────────────────
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── Same drill from Bike ──────────────────────────────────────────────
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# List scroll resets to top after the back-pops; swipe down to verify
# Bike's row survived the deep navigation.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
