appId: io.github.tieo.taghistory
name: Settings — Refresh now button visible, tappable, leaves screen alive
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_now"
    timeout: 25000

# First press: refresh runs, screen stays on Settings.
- tapOn:
    id: "btn_refresh_now"
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_now"
    timeout: 25000

# Press again immediately — debounce/idempotency. App must not crash.
- tapOn:
    id: "btn_refresh_now"
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Back to map. Map widgets still rendered after a refresh from Settings.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000
