appId: io.github.tieo.taghistory
name: History — rapid day prev/next does not crash, ends on valid label
---
# Mash btn_day_prev and btn_day_next alternately. Final state must show one
# of the legal day labels (Today, Yesterday, or YYYY-MM-DD). The day-nav
# controls remain visible the entire time.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# left, right, left, right, left, right
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true

# Day-nav controls still alive
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000

# Final label is one of: Today, Yesterday, or YYYY-MM-DD. Today wins
# after balanced taps starting from Today.
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"

# Round 2: heavier — 12 alternating taps, ending balanced.
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000

# Round 3: walk to oldest seeded bucket, then back to Today.
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
