appId: io.github.tieo.taghistory
name: "Stress: settings deep scroll + theme change then back — map list intact"
---
# Selects a row, scrolls deep into settings, mutates the theme (a
# persistent state change that triggers recomposition), backs out, and
# verifies the map list survived intact. With the glass list all rows
# stay visible — the old "pager card index unchanged" check becomes
# "every row still rendered after the settings round-trip".
- runFlow:
    file: 00_seed_test_data.yaml

# Select Bike before going to settings.
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "tag_row_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# Open settings, scroll deep, change theme.
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "btn_theme_dark"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "btn_theme_dark"
- tapOn:
    id: "btn_theme_system"

# Back → map list intact, still on map (not login).
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# Second pass: theme cycle, scroll, back — list still whole.
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "btn_theme_light"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "btn_theme_light"
- tapOn:
    id: "btn_theme_dark"
- tapOn:
    id: "btn_theme_system"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
