appId: io.github.tieo.taghistory
name: "Stress: settings deep scroll then back — card at non-zero index unchanged"
---
# Scrolls deep into settings (past Account section), triggers theme change, then
# backs out. Tests that the map pager card is not reset even after settings
# makes a persistent state change (theme rewrite could trigger recomposition).
- runFlow:
    file: 00_seed_test_data.yaml

# Park on Bike (index 2) before going to settings
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# Open settings and scroll all the way down
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- swipe:
    direction: UP
    duration: 800
- swipe:
    direction: UP
    duration: 800
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 25000

# Change theme (state mutation) while scrolled deep
- scrollUntilVisible:
    element:
      id: "btn_theme_dark"
    direction: UP
    timeout: 25000
- tapOn:
    id: "btn_theme_dark"
- tapOn:
    id: "btn_theme_system"

# Back → Bike must still be the active card
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"

# ── second pass: from Bike, swipe to Backpack, deep-scroll settings, theme,
# deep-scroll to bottom, back → Backpack still active ────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- swipe:
    direction: UP
    duration: 800
- swipe:
    direction: UP
    duration: 800
- extendedWaitUntil:
    visible:
      text: "Account"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "btn_theme_light"
    direction: UP
    timeout: 25000
- tapOn:
    id: "btn_theme_light"
- tapOn:
    id: "btn_theme_dark"
- tapOn:
    id: "btn_theme_system"
- swipe:
    direction: UP
    duration: 800
- extendedWaitUntil:
    visible:
      text: "About"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- assertNotVisible:
    text: "Bike"
- assertNotVisible:
    text: "Car Keys"
- assertNotVisible:
    id: "btn_import"
