appId: io.github.tieo.taghistory
name: Navigation — rapid back from deep stack does not crash
---
# Stacks Map -> Details -> History, then mashes back rapidly. Final state
# must be a tappable map (btn_settings visible).
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000

# Three back-presses in quick succession (only need 2 to reach map; the
# third pops to launcher only if not handled. The PlatformBackHandler
# guards against that.)
- back
- back

- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_day_prev"

# Round 2: drill down again on Backpack and double-back. Same outcome.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# Round 3: more rapid sequence with a settings interjection.
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
