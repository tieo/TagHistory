appId: io.github.tieo.taghistory
name: Settings — Refresh now shows a non-empty result message
---
# After tapping btn_refresh_now the screen must remain on Settings AND a
# small status message appears beneath the button. The message text is
# either "Refresh complete" or starts with "Refresh failed:". Both contain
# the substring "Refresh".
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
# Scroll it into view first — the Background-sync section above can grow
# (battery-optimization warning), pushing Refresh now below the fold.
- scrollUntilVisible:
    element:
      id: "btn_refresh_now"
    direction: DOWN
    timeout: 25000
    centerElement: true

- tapOn:
    id: "btn_refresh_now"

# Wait for the refresh to settle. After completion the result message must
# render — it contains the word "Refresh" (matches "Refresh complete" or
# "Refresh failed: …"). A 15s ceiling covers slow network mocks.
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000

- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_now"
    timeout: 25000

# Press Refresh now a second time — the button stays tappable, message updates.
- tapOn:
    id: "btn_refresh_now"
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# (The in-app debug sync-log panel was removed; sync logs are logcat-only
# now, read with `adb logcat -s TagHistory`. No in-app panel to assert.)

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
