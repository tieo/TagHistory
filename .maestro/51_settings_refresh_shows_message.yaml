appId: io.github.tieo.taghistory
name: Settings — Refresh now shows a non-empty result message
---
# After tapping btn_refresh_now the screen must remain on Settings AND a
# small status message appears beneath the button. The message text is
# either "Refresh complete" or starts with "Refresh failed:". Both contain
# the substring "Refresh".
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_now"
    timeout: 25000

- tapOn:
    id: "btn_refresh_now"

# Wait for the refresh to settle. After completion the result message must
# render — it contains the word "Refresh" (matches "Refresh complete" or
# "Refresh failed: …"). A 15s ceiling covers slow network mocks.
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000

- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_now"
    timeout: 25000

# Press Refresh now a second time — the button stays tappable, message updates.
- tapOn:
    id: "btn_refresh_now"
- extendedWaitUntil:
    visible:
      text: ".*Refresh.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# Open the debug panel to verify the refresh actually fired and produced
# log events (catches the historical bug where Refresh didn't log).
- tapOn:
    text: "Show debug data"
- extendedWaitUntil:
    visible:
      id: "sync_log_header"
    timeout: 25000
# Refresh adds a flurry of INFO entries that quickly push the
# original "Refresh started" START line out of the visible window
# of the log's LazyColumn (off-screen rows aren't composed). Scroll
# the log up until the START row reappears.
- scrollUntilVisible:
    element:
      text: ".*Refresh started.*"
    direction: DOWN
    timeout: 25000
    centerElement: true
    speed: 40
- extendedWaitUntil:
    visible:
      text: "START"
    timeout: 25000
# Hide debug panel.
- tapOn:
    text: "Show debug data"
- extendedWaitUntil:
    visible:
      text: "Show debug data"
    timeout: 25000
- assertNotVisible:
    id: "sync_log_header"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
