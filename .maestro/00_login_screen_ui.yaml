appId: io.github.tieo.taghistory
name: Login screen — UI elements present
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000

# Initial UI: credential fields visible, OTP path widgets hidden.
- extendedWaitUntil:
    visible:
      id: "field_email"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "field_password"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_login"
    timeout: 25000
- assertNotVisible:
    id: "field_otp_code"
- assertNotVisible:
    id: "btn_start_over"
- assertNotVisible:
    id: "btn_paste_code"

# Map screen widgets must NOT be visible from the login screen.
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    text: "Car Keys"

# Email field is empty by default. Tap → focus → still empty until typed.
- tapOn:
    id: "field_email"
- extendedWaitUntil:
    visible:
      id: "field_email"
    timeout: 25000
- assertNotVisible:
    id: "field_otp_code"

# Hide app and bring it back: state survives backgrounding.
- pressKey: HOME
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "field_email"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "field_password"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_login"
    timeout: 25000
- assertNotVisible:
    id: "field_otp_code"
