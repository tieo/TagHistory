appId: io.github.tieo.taghistory
name: Login screen — UI elements present
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 5000
- assertVisible:
    id: "field_email"
- assertVisible:
    id: "field_password"
- assertVisible:
    id: "btn_login"
- assertNotVisible:
    id: "field_otp_code"
- assertNotVisible:
    id: "btn_start_over"
