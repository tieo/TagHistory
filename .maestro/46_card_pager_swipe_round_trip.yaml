appId: io.github.tieo.taghistory
name: Map — list scroll down to last tag and back lands on Car Keys
---
# Replaces the old pager-symmetry flow: scroll to the bottom of the
# glass list (Bike) and back to the top (Car Keys). Catches list
# recycling bugs where rows lose content after scroll round-trips.
- runFlow:
    file: 00_seed_test_data.yaml

- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Repeat once — second round-trip equally stable.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
