appId: io.github.tieo.taghistory
name: Map — card pager swipe right then left lands back on Car Keys
---
# Verifies the pager is symmetric: from Car Keys, one left -> Backpack,
# then one right -> Car Keys. Catches one-sided pager bugs.
- runFlow:
    file: 00_seed_test_data.yaml

- assertVisible:
    text: "Car Keys"

# left -> Backpack
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000

# right -> Car Keys
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 15000
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Backpack"

# Two-step left -> Bike, two-step right -> Car Keys.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 15000
- assertNotVisible:
    text: "Backpack"
- assertNotVisible:
    text: "Car Keys"

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 15000

# Boundary slams: extra right swipe at Car Keys must not advance.
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Backpack"
- assertVisible:
    id: "btn_settings"
