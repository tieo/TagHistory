appId: io.github.tieo.taghistory
name: "Stress: swiping between cards does not reset map camera to world"
---
# After the initial auto-focus on Car Keys (Berlin, street level), switching
# cards must NOT jump to world map. Structural assertion: the selected beacon's
# chip label is visible on-screen. If camera reset to world, the Berlin beacons
# would be off-screen and their map chip overlays would not be visible.
# Note: map chip text ≠ card text — card is always visible, chip is map-positioned.
- runFlow:
    file: 00_seed_test_data.yaml

# Seed auto-focuses on Car Keys. btn_settings visible = map loaded at street level.
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Swipe to Backpack — camera should animate to Backpack's Berlin position, NOT world
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
# btn_settings still present = still on map screen, not crashed/reset to login
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Swipe to Bike
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Wild burst — map must still be on map screen throughout
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# Not on login screen (btn_import would appear if no auth)
- assertNotVisible:
    id: "btn_import"

# Bounce burst at high speed — pager must not crash, settings still tappable.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 150
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 150
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 150
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 150
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 150
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 150
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# After all the bouncing, swipe deterministically to land on Bike, then back
# to Backpack: the named card must be visible (camera is at street level so
# the card overlay still renders; world-zoom would not show the card).
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
