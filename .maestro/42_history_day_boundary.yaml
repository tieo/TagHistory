appId: io.github.tieo.taghistory
name: History — pressing day-next at Today (boundary) is a no-op, day stays Today
---
# Today is the newest seeded day. btn_day_next is disabled there. Tapping it
# (optional: true so the test does not fail if disabled) must NOT advance
# the date. Verifies boundary behavior without relying on enabled state.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Try to tap forward at the upper boundary.
- tapOn:
    id: "btn_day_next"
    optional: true
- tapOn:
    id: "btn_day_next"
    optional: true

# Day stays Today (still visible after attempted forward navigation).
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"

# Day-prev: Today -> Yesterday. Then try day-next twice -- last tap is no-op
# since we are at the upper boundary again.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"

# Lower boundary: walk past the oldest seed via three day-prev presses, then
# walk back forward — controls stay alive, never crash to white screen.
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
