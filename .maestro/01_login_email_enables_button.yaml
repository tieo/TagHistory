appId: io.github.tieo.taghistory
name: Login screen — fields accept input and login button is tappable
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000

# Type email, immediately readable back from the field.
- tapOn:
    id: "field_email"
- inputText: "test@example.com"
- extendedWaitUntil:
    visible:
      text: "test@example.com"
    timeout: 25000

# The OTP-flow widgets must NOT appear yet.
- assertNotVisible:
    id: "field_otp_code"
- assertNotVisible:
    id: "btn_start_over"

- tapOn:
    id: "field_password"
- inputText: "test_password"

# Login button must still be present and tappable (enabled by non-empty input).
- extendedWaitUntil:
    visible:
      id: "btn_login"
    timeout: 25000
- tapOn:
    id: "btn_login"

# After tap, EITHER still on credentials screen with email retained
# (network blocked / failed locally, no transition) OR moved to 2FA screen.
- runFlow:
    when:
      visible:
        text: "Welcome to TagHistory"
    commands:
      - extendedWaitUntil:
          visible:
            text: "Welcome to TagHistory"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_login"
          timeout: 25000
      # Email text was retained across the failed login attempt.
      - extendedWaitUntil:
          visible:
            text: "test@example.com"
          timeout: 25000
- runFlow:
    when:
      visible:
        id: "field_otp_code"
    commands:
      - extendedWaitUntil:
          visible:
            id: "field_otp_code"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_start_over"
          timeout: 25000
      # Once on OTP screen, the credentials fields must be hidden.
      - assertNotVisible:
          id: "field_password"
      - assertNotVisible:
          id: "btn_login"

# Map widgets must never appear from a failed login.
- assertNotVisible:
    id: "btn_settings"
