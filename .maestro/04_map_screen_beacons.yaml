appId: io.github.tieo.taghistory
name: Map screen — seeded beacons appear as cards and markers
---
# Structural assertions: card text visible, pager scrollable via card-area swipes.
# Adds: emoji glyphs, last-updated label format, full-cycle pager round-trip,
# and circle-action visibility on every card.
- runFlow:
    file: 00_seed_test_data.yaml

# First card must be Car Keys (most recent — seeded 30 min ago).
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000
# Route circle-action label is also rendered.
- extendedWaitUntil:
    visible:
      text: "Route"
    timeout: 25000
# Other beacons must NOT be visible on the centre card overlay.
- assertNotVisible:
    text: "Backpack"
- assertNotVisible:
    text: "Bike"

# "Updated <N> min ago" / "Updated <N> h ago" — catches enum/raw output.
- extendedWaitUntil:
    visible:
      text: ".*Updated.*ago.*"
    timeout: 25000

# Swipe LEFT on card area (75% down screen) → Backpack.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*Updated.*ago.*"
    timeout: 25000

# Swipe LEFT again → Bike.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- assertNotVisible:
    text: "Backpack"
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000

# Swipe RIGHT twice → Car Keys again, full round-trip.
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Bike"
- assertNotVisible:
    text: "Backpack"

# Settings button is part of map screen; never gone during card scroll.
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
