appId: io.github.tieo.taghistory
name: Map screen — seeded beacons all appear in the glass tag list
---
# Structural assertions for the glass list: ALL tags visible at once
# (sorted most-recent first), every visible row carries the circle
# actions, header shows count + refresh + edit affordances.
- runFlow:
    file: 00_seed_test_data.yaml

# Header: "Tags" + count + refresh + manage-tags entry points.
- extendedWaitUntil:
    visible:
      text: "Tags"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_all"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_edit_tags"
    timeout: 25000

# Most-recent tag (Car Keys, seeded 30 min ago) is the first row and
# visible without scrolling. Backpack too on a 640px-tall screen.
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# Row carries the circle actions.
- extendedWaitUntil:
    visible:
      id: "btn_card_details.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history.*"
    timeout: 25000

# "Updated <N> min ago" / "Updated <N> h ago" — catches enum/raw output.
- extendedWaitUntil:
    visible:
      text: ".*Updated.*ago.*"
    timeout: 25000

# Bike (oldest) is reachable by scrolling the list.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# Scroll back up — first row + header still intact (no recycler crash).
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Settings button is part of map screen; never gone during list scroll.
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
