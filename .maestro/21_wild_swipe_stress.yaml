appId: io.github.tieo.taghistory
name: "Stress: wild list scrolling — rows + actions survive chaotic input"
---
# The old pager-boundary stress is obsolete (no pager). Replacement:
# hammer the glass list with fast alternating up/down flings, then
# confirm every row, its circle actions, and the header controls are
# still rendered and tappable — i.e. the LazyColumn doesn't corrupt or
# lose content under chaotic input, and we never fell off the map.
- runFlow:
    file: 00_seed_test_data.yaml

- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000

# Burst of fast flings within the list area (bottom ~45% of screen).
- repeat:
    times: 6
    commands:
      - swipe:
          start: "50%, 88%"
          end: "50%, 60%"
          duration: 150
      - swipe:
          start: "50%, 60%"
          end: "50%, 92%"
          duration: 150

# After the chaos: list settled, all three rows present, header intact.
- scrollUntilVisible:
    element:
      id: "tag_row_test-beacon-001-aaa"
    direction: UP
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_all"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Row actions still wired — open Car Keys details and back.
- tapOn:
    id: "btn_card_details_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Bike still reachable after everything.
- scrollUntilVisible:
    element:
      id: "tag_row_test-beacon-003-ccc"
    direction: DOWN
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
