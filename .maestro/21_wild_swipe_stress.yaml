appId: io.github.tieo.taghistory
name: "Stress: wild card swipes — card always lands on correct beacon"
---
# Hammers the pager with boundary slams and single-step advances.
# Strategy: slam to a known boundary, then step to a specific card.
# This is deterministic regardless of pager animation timing.
# Catches: off-by-one, pager desynced from selectedBeaconId, recomposition reset.
- runFlow:
    file: 00_seed_test_data.yaml

# ── slam left past the end → Bike (boundary) ─────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# ── one step right from Bike → Backpack ──────────────────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# ── one more step right → Car Keys ───────────────────────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── slam right past the start → Car Keys (boundary) ──────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── two steps left → Bike ─────────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# ── slam right from Bike → Car Keys ──────────────────────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── step to middle, check buttons still alive ─────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Bike"

# ── alternating swipes: L, R, L, R back to Backpack via repeated bounces ───
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# ── slam left to Bike, slam right to Car Keys, slam left twice to Bike ───
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 200
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# ── settings button is still tappable from any card ────────────────────────
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000

# ── final round-trip back to Car Keys ───────────────────────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Backpack"
- assertNotVisible:
    text: "Bike"
