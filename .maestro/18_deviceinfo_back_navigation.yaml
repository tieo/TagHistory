appId: io.github.tieo.taghistory
name: Device info — back button returns to map with the list intact
---
- runFlow:
    file: 00_seed_test_data.yaml

# Open details for Backpack via its own row action.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
# On details: map landmarks gone, details ones present.
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_refresh_all"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# Back on map: the full list is restored, details widgets gone.
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_rename"
