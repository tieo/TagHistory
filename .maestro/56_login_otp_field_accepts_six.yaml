appId: io.github.tieo.taghistory
name: Login — 2FA OTP field accepts six digits without crashing
---
# Without real Apple credentials we cannot reach the OTP screen via real
# auth. This test only verifies that the LOGIN form responds correctly to
# wrong creds: either an error is shown or btn_start_over appears. Verifies
# the login form does not crash on submit.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000

- tapOn:
    id: "field_email"
- inputText: "test@example.com"
- tapOn:
    id: "field_password"
- inputText: "wrongpassword123"
- tapOn:
    id: "btn_login"

# After a failed login attempt, the form must still be alive — either the
# password field is still visible (request fired but error displayed) or
# btn_start_over appears (state moved into 2FA-style UI then surfaced an
# error). Either way the app didn't crash.
- runFlow:
    when:
      visible:
        id: "btn_start_over"
    commands:
      - extendedWaitUntil:
          visible:
            id: "btn_start_over"
          timeout: 25000

- runFlow:
    when:
      visible:
        id: "field_email"
    commands:
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_login"
          timeout: 25000
      - assertNotVisible:
          id: "field_otp_code"

# Hit Login with the same wrong creds again — must not crash, must end in
# the same one of two states (login form OR start-over screen).
- tapOn:
    id: "btn_login"
- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000
- runFlow:
    when:
      visible:
        id: "btn_start_over"
    commands:
      - extendedWaitUntil:
          visible:
            id: "btn_start_over"
          timeout: 25000
      - assertNotVisible:
          id: "field_email"
      - assertNotVisible:
          id: "btn_login"
- runFlow:
    when:
      visible:
        id: "field_email"
    commands:
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_password"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_login"
          timeout: 25000
      - assertNotVisible:
          id: "field_otp_code"

# Map screen widgets must never appear on a wrong-cred attempt.
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    text: "Car Keys"
