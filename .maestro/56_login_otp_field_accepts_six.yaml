appId: io.github.tieo.taghistory
name: Login — 2FA OTP field accepts six digits without crashing
---
# Without real Apple credentials we cannot reach the OTP screen via real
# auth. This test only verifies that the LOGIN form responds correctly to
# wrong creds: either an error is shown or btn_start_over appears. Verifies
# the login form does not crash on submit.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 5000

- tapOn:
    id: "field_email"
- inputText: "test@example.com"
- tapOn:
    id: "field_password"
- inputText: "wrongpassword123"
- tapOn:
    id: "btn_login"

# After a failed login attempt, the form must still be alive — either the
# password field is still visible (request fired but error displayed) or
# btn_start_over appears (state moved into 2FA-style UI then surfaced an
# error). Either way the app didn't crash.
- runFlow:
    when:
      visible:
        id: "btn_start_over"
    commands:
      - assertVisible:
          id: "btn_start_over"

- runFlow:
    when:
      visible:
        id: "field_email"
    commands:
      - assertVisible:
          id: "field_email"
      - assertVisible:
          id: "btn_login"
