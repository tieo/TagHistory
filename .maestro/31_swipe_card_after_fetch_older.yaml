appId: io.github.tieo.taghistory
name: "Stress: per-beacon history after fetch-older — no state bleed"
---
# Opens history for Car Keys, fetches older, goes back. Then opens
# history for Backpack and Bike the same way. Catches state bleed where
# a previous beacon's history contaminates the next screen, or the
# ViewModel isn't reset between navigations.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Car Keys: open history, fetch older ───────────────────────────────
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_history_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# ── Backpack: open history, fetch older ───────────────────────────────
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_history_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# ── Bike: open history ────────────────────────────────────────────────
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "btn_card_history_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# Back-nav reset the list to the top; swipe down to confirm Bike's row.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
