appId: io.github.tieo.taghistory
name: History screen — opening from each list row renders that beacon
---
# Opens history from each tag row's own history action (all rows are
# visible at once in the glass list) and verifies the day-nav controls
# render — proof the History VM loaded for that beacon.
- runFlow:
    file: 00_seed_test_data.yaml

# Car Keys history (6 reports seeded).
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_history_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Backpack history (2 reports seeded).
- tapOn:
    id: "btn_card_history_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Bike history (1 report seeded, today).
- tapOn:
    id: "btn_card_history_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
