appId: io.github.tieo.taghistory
name: Map — card pager swipe changes visible beacon name and is symmetric
---
- runFlow:
    file: 00_seed_test_data.yaml

- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Backpack"
- assertNotVisible:
    text: "Bike"

# Forward through all three cards.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- assertNotVisible:
    text: "Car Keys"

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 15000
- assertNotVisible:
    text: "Backpack"

# Bike is the boundary — extra left swipe must not advance further.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- assertVisible:
    text: "Bike"

# Reverse direction returns through Backpack to Car Keys.
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- assertNotVisible:
    text: "Bike"

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 15000

# Car Keys is the leading boundary — extra right swipe must not advance further.
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    text: "Backpack"

# btn_settings stays visible the whole time (proves we are on map).
- assertVisible:
    id: "btn_settings"
