appId: io.github.tieo.taghistory
name: Map — tapping list rows selects each beacon, selection is stable
---
# Selection semantics in the glass list: tapping a row selects that
# beacon (marker focus). All rows stay visible the whole time — the
# old pager's one-card-at-a-time assertions are obsolete. Structural
# proof of selection: rows remain tappable, the app stays on the map
# (btn_settings present), and re-tapping is idempotent (no crash, no
# nav). Marker highlight itself is canvas-drawn — not assertable.
- runFlow:
    file: 00_seed_test_data.yaml

- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000

# Select Backpack, then Bike, then back to Car Keys.
- tapOn:
    id: "tag_row_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "tag_row_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "tag_row_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Re-tap the already-selected row — idempotent, still on map.
- tapOn:
    id: "tag_row_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_all"
    timeout: 25000
