appId: io.github.tieo.taghistory
name: Map — card pager swipe changes visible beacon name
---
- runFlow:
    file: 00_seed_test_data.yaml

- assertVisible:
    text: "Car Keys"

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 5000

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 5000

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 5000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 5000
