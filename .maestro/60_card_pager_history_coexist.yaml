appId: io.github.tieo.taghistory
name: History + Pager — open history, back, swipe to next, open history again
---
# Verifies that opening then closing history does not break the card pager,
# and that swiping the pager afterwards still navigates to a different
# beacon's history. Catches state leaks where the pager freezes after a
# back-pop or where the History VM caches the wrong beacon ID.
- runFlow:
    file: 00_seed_test_data.yaml

# Card 1 (Car Keys) -> History -> back
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Swipe to card 2 (Backpack)
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# Card 2 -> History -> back
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# Swipe back to card 1, sanity check pager still works.
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Open history once more from Car Keys — must not show Backpack's data.
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
# Car Keys today: 3 points — items 0, 1, 2 all visible.
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# Swipe to Bike (1 point only, today). Open history. List has only item 0.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- assertNotVisible:
    text: "Backpack"
