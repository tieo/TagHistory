appId: io.github.tieo.taghistory
name: History screen — seeded reports visible, day nav works, back returns to map
---
- runFlow:
    file: 00_seed_test_data.yaml

# Open history from map card (Car Keys has 6 seeded reports across 3 days).
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000

# History landmarks: day nav present, map widgets gone.
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_card_details"

# Expand the bottom sheet so we can verify the chronological list renders.
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
# "data point" / "data points" pluralization rendered.
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
# At least one "HH:MM" timestamp visible — catches UTC-vs-local format bugs.
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000

# Day-prev to Yesterday: list re-renders.
- tapOn:
    id: "btn_day_prev"
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- assertNotVisible:
    text: "Today"

# Day-next to Today again: round-trip.
- tapOn:
    id: "btn_day_next"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Back returns to map. Card pager picks up where we left off.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"
