appId: io.github.tieo.taghistory
name: History screen — seeded reports visible, fetch older works, back returns to map
---
- runFlow:
    file: 00_seed_test_data.yaml

# Open history from map card (Car Keys has 6 seeded reports across 3 days)
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_fetch_older"
    timeout: 5000

# At least one history entry must be rendered
- assertVisible:
    id: "btn_fetch_older"

# Fetch older — button remains present after fetch completes
- tapOn:
    id: "btn_fetch_older"
- extendedWaitUntil:
    visible:
      id: "btn_fetch_older"
    timeout: 15000

# Back returns to map
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
