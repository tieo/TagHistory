appId: io.github.tieo.taghistory
name: History — tapping a list item selects the point (highlighted entry)
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Expand sheet (twice in case the first didn't reach Expanded state).
- swipe:
    start: "50%, 88%"
    end: "50%, 40%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 20%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000

# Item 0 (newest) is pre-selected. Tap item 1 to select it.
- tapOn:
    id: "history_item_1"
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000

# Sheet remains open after tap (item 1 still visible).
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*data point.*"
    timeout: 25000

# Tap item 2 to select older point. Day label is still Today (3 points).
- tapOn:
    id: "history_item_2"
- extendedWaitUntil:
    visible:
      id: "history_item_2"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Tap back to item 0 — selection bounces around without crashing.
- tapOn:
    id: "history_item_0"
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

# At least one timestamp line is rendered — catches blank labels.
- extendedWaitUntil:
    visible:
      text: ".*At \\d.*"
    timeout: 25000

# Day-prev to Yesterday — items reset, item 0 is now Yesterday's newest.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- tapOn:
    id: "history_item_0"
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"
