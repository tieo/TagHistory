appId: io.github.tieo.taghistory
name: "Device info — remove dialog: cancel keeps device, dialog state idempotent"
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 5000
- assertNotVisible:
    text: "Remove device\\?"

# Cancel via Cancel button: device survives.
- tapOn:
    id: "btn_remove"
- assertVisible:
    text: "Remove device\\?"
# Dialog buttons render in a separate window — text selectors most reliable.
- assertVisible:
    text: "Cancel"
- assertVisible:
    text: "Remove"
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Remove device\\?"
- assertVisible:
    id: "btn_remove"
- assertVisible:
    id: "btn_rename"
- assertVisible:
    id: "btn_view_history"

# Cancel via system back: device also survives.
- tapOn:
    id: "btn_remove"
- extendedWaitUntil:
    visible:
      text: "Remove device\\?"
    timeout: 3000
- back
- assertNotVisible:
    text: "Remove device\\?"
- assertVisible:
    id: "btn_remove"

# Round-trip back to map. Beacon name still on the pager (not removed).
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Car Keys"
- assertVisible:
    id: "btn_card_details"
