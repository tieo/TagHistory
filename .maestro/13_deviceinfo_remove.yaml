appId: io.github.tieo.taghistory
name: "Device info — remove dialog: cancel keeps device, dialog state idempotent"
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- assertNotVisible:
    text: "Remove device\\?"

# Cancel via Cancel button: device survives.
- tapOn:
    id: "btn_remove"
- extendedWaitUntil:
    visible:
      text: "Remove device\\?"
    timeout: 25000
# Dialog buttons render in a separate window — text selectors most reliable.
- extendedWaitUntil:
    visible:
      text: "Cancel"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Remove"
    timeout: 25000
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Remove device\\?"
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000

# Cancel via system back: device also survives.
- tapOn:
    id: "btn_remove"
- extendedWaitUntil:
    visible:
      text: "Remove device\\?"
    timeout: 25000
- back
- assertNotVisible:
    text: "Remove device\\?"
- extendedWaitUntil:
    visible:
      id: "btn_remove"
    timeout: 25000

# Round-trip back to map. Beacon name still on the pager (not removed).
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
