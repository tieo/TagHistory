appId: io.github.tieo.taghistory
name: "Stress: open details ×3 in a row for same beacon — no state corruption"
---
# Opens and immediately backs out of DeviceInfo three times for the same beacon.
# Catches ViewModel lifecycle bugs (e.g. second open shows stale/doubled state).
- runFlow:
    file: 00_seed_test_data.yaml

# ── open 1 ───────────────────────────────────────────────────────────────────
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── open 2 ───────────────────────────────────────────────────────────────────
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── open 3 ───────────────────────────────────────────────────────────────────
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── open 4 ───────────────────────────────────────────────────────────────────
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── open 5: do actual rename to confirm data integrity after rapid reopens ──
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Car Keys"
- eraseText: 50
- inputText: "Triple Check"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Triple Check"
    timeout: 25000
- assertNotVisible:
    text: "Rename device"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Triple Check"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"

# ── reopen details once more: name still persisted, no reset ─────────────────
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Triple Check"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Triple Check"
    timeout: 25000
