appId: io.github.tieo.taghistory
name: Settings — background sync toggle shows/hides interval and persists
---
# Background sync defaults to ON (Interval visible initially).
# Toggle OFF → Interval hidden. Toggle ON → Interval visible again.
# Persists state across leaving Settings and reopening it.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Background sync"
    timeout: 25000

# Default: ON → Interval visible.
- extendedWaitUntil:
    visible:
      text: "Interval"
    timeout: 25000

# Toggle OFF → Interval hidden, screen still alive.
- tapOn:
    id: "toggle_background_sync"
- assertNotVisible:
    text: "Interval"
- extendedWaitUntil:
    visible:
      text: "Background sync"
    timeout: 25000

# Persistence: leave Settings and come back with OFF state.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Background sync"
    timeout: 25000
- assertNotVisible:
    text: "Interval"

# Toggle ON → Interval visible again.
- tapOn:
    id: "toggle_background_sync"
- extendedWaitUntil:
    visible:
      text: "Interval"
    timeout: 25000

# Toggle OFF/ON rapidly twice — final state ON, Interval shown.
- tapOn:
    id: "toggle_background_sync"
- assertNotVisible:
    text: "Interval"
- tapOn:
    id: "toggle_background_sync"
- extendedWaitUntil:
    visible:
      text: "Interval"
    timeout: 25000

# Back to map and ensure no leak of Settings UI.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    text: "Background sync"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
