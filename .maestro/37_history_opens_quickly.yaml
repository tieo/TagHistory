appId: io.github.tieo.taghistory
name: History — opens within 3s on cached data (btn_day_prev visible quickly)
---
# After seed completes, the data is already in DB. Opening history should
# render the day nav controls fast — no network round trip required.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_day_next"
    timeout: 25000
# Today label visible immediately too — proves DB load did not block.
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_card_details"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"

# Reopen — must still open quickly (cached path the second time).
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Swipe to Backpack and open history — also fast.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
