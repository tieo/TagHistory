appId: io.github.tieo.taghistory
name: History — day navigation prev/next changes point list
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Sheet is fixed at peek; today's items are visible immediately.
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000

# Start on Today. Go back two days.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000

# Yesterday has 2 seeded points — summary still renders.
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000

- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*\\d\\d\\d\\d.*"
    timeout: 25000

# Navigate forward twice back to Today
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"
# Today has 3 points; items 0 and 1 fit in the peek-height list.
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000

# Walk back two days, then forward two days again — exercises VM caching.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*\\d\\d\\d\\d.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"
