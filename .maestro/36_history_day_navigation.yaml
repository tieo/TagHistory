appId: io.github.tieo.taghistory
name: History — day navigation prev/next changes point list
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 6000

# Expand sheet to see list
- swipe:
    start: "50%, 88%"
    end: "50%, 40%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: ".*data point.*"
    timeout: 6000

# Start on Today. Go back two days.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 4000
- assertVisible:
    text: "Yesterday"

# Yesterday has 2 seeded points
- assertVisible:
    text: ".*data point.*"

- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*-.*-.*"
    timeout: 4000

# Navigate forward twice back to Today
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 4000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 4000
- assertVisible:
    text: "Today"

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
