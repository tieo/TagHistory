appId: io.github.tieo.taghistory
name: Login — start over from 2FA returns to credentials form
---
# Same setup as 03_login_start_over but stronger: after pressing "Start
# over" we explicitly verify that all three credential-form widgets are
# back, AND that the OTP field is gone.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      text: "Welcome to TagHistory"
    timeout: 25000

- tapOn:
    id: "field_email"
- inputText: "test@example.com"
- tapOn:
    id: "field_password"
- inputText: "wrongpassword"
- tapOn:
    id: "btn_login"

# If the app reached the 2FA screen (Start over button visible), tap it
# and verify we're back on the credentials screen.
- runFlow:
    when:
      visible:
        id: "btn_start_over"
    commands:
      - tapOn:
          id: "btn_start_over"
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_email"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "field_password"
          timeout: 25000
      - extendedWaitUntil:
          visible:
            id: "btn_login"
          timeout: 25000
      - assertNotVisible:
          id: "btn_start_over"
      - assertNotVisible:
          id: "field_otp_code"
      - assertNotVisible:
          id: "btn_paste_code"

      # Email field is preserved or cleared — either is fine. The form must
      # accept new input either way.
      - tapOn:
          id: "field_email"
      - eraseText: 50
      - inputText: "second@example.com"
      - extendedWaitUntil:
          visible:
            text: "second@example.com"
          timeout: 25000

      # Try a different wrong password. Form does not crash, ends in same
      # one-of-two state.
      - tapOn:
          id: "field_password"
      - eraseText: 50
      - inputText: "anotherwrongpassword"
      - tapOn:
          id: "btn_login"
      - extendedWaitUntil:
          visible:
            text: "Welcome to TagHistory"
          timeout: 25000

      # If start-over reappears, exercise it again to fully unwind.
      - runFlow:
          when:
            visible:
              id: "btn_start_over"
          commands:
            - tapOn:
                id: "btn_start_over"
            - extendedWaitUntil:
                visible:
                  id: "field_email"
                timeout: 25000
            - extendedWaitUntil:
                visible:
                  id: "field_email"
                timeout: 25000
            - assertNotVisible:
                id: "btn_start_over"

# Map widgets must never appear at any point.
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    text: "Car Keys"
