appId: io.github.tieo.taghistory
name: History — bottom sheet shows day nav, point list, and "Fetch older"
---
- runFlow:
    file: 00_seed_test_data.yaml

# Open history from card (Car Keys has 6 seeded points across 3 days)
- tapOn:
    id: "btn_card_history.*"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Sheet peeked: day label visible at bottom
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Sheet is fixed at peek; date pill, summary, items 0/1 are visible immediately.
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000

# First history item is always seeded — visible in list
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

# Navigate to previous day (← arrow)
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000

# Navigate forward (→ arrow) to come back
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Day-prev to Yesterday: state transition fully visible.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
# Yesterday for Car Keys has 2 reports.
- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000

# Day-prev once more — older bucket (3 days ago, 1 report). The label is a
# YYYY-MM-DD because it's older than Yesterday.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*\\d\\d\\d\\d.*"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"
- assertNotVisible:
    text: "Today"

# Walk back forward to Today via two day-next presses.
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- tapOn:
    id: "btn_day_next"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

# Back returns to map.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_day_prev"
- assertNotVisible:
    text: "Yesterday"
