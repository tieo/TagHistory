appId: io.github.tieo.taghistory
name: "Stress: rename three beacons — new names survive scrolling and reopens"
---
# Renames all three beacons (one each) via their own row's details
# action, scrolls the list away and back, and confirms the names
# persisted. Catches write-through bugs where UI state is cached but
# the DB wasn't updated, or rows reload stale data after recycling.
# Dialog content uses text selectors because Compose AlertDialog
# testTags are not reachable from Maestro.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Rename Car Keys → "Alpha Tag" ─────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Car Keys"
- eraseText: 50
- inputText: "Alpha Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 25000
- assertNotVisible:
    text: "Rename device"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"

# ── Rename Backpack → "Beta Tag" ──────────────────────────────────────
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Backpack"
- eraseText: 50
- inputText: "Beta Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 25000
- assertNotVisible:
    text: "Backpack"

# ── Rename Bike → "Gamma Tag" ─────────────────────────────────────────
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Bike"
- eraseText: 50
- inputText: "Gamma Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# Back-nav resets list scroll; swipe down to the renamed row.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- assertNotVisible:
    text: "Bike"

# ── Scroll wildly and back — all three new names must survive ─────────
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- swipe:
    start: "50%, 70%"
    end: "50%, 95%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- assertNotVisible:
    text: "Bike"

# ── Reopen one via details to confirm names persist on reload ─────────
- tapOn:
    id: "btn_card_details_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
# List scroll resets after back; swipe down to the renamed row again.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
