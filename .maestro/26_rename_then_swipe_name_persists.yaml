appId: io.github.tieo.taghistory
name: "Stress: rename two beacons — new names survive card swipes"
---
# Renames two different beacons, swipes away and back, and confirms the names
# persisted. Catches write-through bugs where UI state is cached but DB wasn't
# updated, or the card reloads stale data after pager animation.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Rename Car Keys → "Alpha Tag" ────────────────────────────────────────────
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 5000
- tapOn:
    id: "btn_rename"
- tapOn:
    id: "field_rename_name"
- eraseText: 50
- inputText: "Alpha Tag"
- tapOn:
    id: "btn_rename_save"
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Alpha Tag"

# ── Swipe to Backpack, rename → "Beta Tag" ───────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 5000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 5000
- tapOn:
    id: "btn_rename"
- tapOn:
    id: "field_rename_name"
- eraseText: 50
- inputText: "Beta Tag"
- tapOn:
    id: "btn_rename_save"
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 5000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 5000
- assertVisible:
    text: "Beta Tag"

# ── Swipe wildly and back — both names must survive ──────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 5000

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 5000
