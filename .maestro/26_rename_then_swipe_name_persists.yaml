appId: io.github.tieo.taghistory
name: "Stress: rename three beacons — new names survive card swipes and reopens"
---
# Renames all three beacons (one each), swipes away and back, and confirms the
# names persisted. Catches write-through bugs where UI state is cached but DB
# wasn't updated, or the card reloads stale data after pager animation.
# Dialog content uses text selectors because Compose AlertDialog testTags are
# not reachable from Maestro.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Rename Car Keys → "Alpha Tag" ────────────────────────────────────────────
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Car Keys"
- eraseText: 50
- inputText: "Alpha Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 25000
- assertNotVisible:
    text: "Rename device"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertVisible:
    text: "Alpha Tag"
- assertNotVisible:
    text: "Car Keys"

# ── Swipe to Backpack, rename → "Beta Tag" ───────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Backpack"
- eraseText: 50
- inputText: "Beta Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertVisible:
    text: "Beta Tag"
- assertNotVisible:
    text: "Backpack"

# ── Swipe to Bike, rename → "Gamma Tag" ──────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- tapOn:
    id: "btn_rename"
- extendedWaitUntil:
    visible:
      text: "Rename device"
    timeout: 25000
- tapOn:
    text: "Bike"
- eraseText: 50
- inputText: "Gamma Tag"
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertVisible:
    text: "Gamma Tag"
- assertNotVisible:
    text: "Bike"

# ── Swipe wildly and back — all three names must survive ─────────────────────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 25000
- assertNotVisible:
    text: "Backpack"

- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Alpha Tag"
    timeout: 25000
- assertNotVisible:
    text: "Car Keys"

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Beta Tag"
    timeout: 25000

- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 300
- extendedWaitUntil:
    visible:
      text: "Gamma Tag"
    timeout: 25000
- assertNotVisible:
    text: "Bike"

# ── Reopen each via details to confirm names persist on reload ───────────────
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- assertVisible:
    text: "Gamma Tag"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertVisible:
    text: "Gamma Tag"
