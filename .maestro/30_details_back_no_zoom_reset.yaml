appId: io.github.tieo.taghistory
name: "Stress: details→back does not reset map camera to world"
---
# The map must NOT jump to world view when returning from DeviceInfo or History.
# Structural check: btn_settings visible (still on map) + no btn_import
# (auth state intact, not reset to login). Repeats for all three beacons.
- runFlow:
    file: 00_seed_test_data.yaml

# ── Car Keys: details → back ─────────────────────────────────────────────────
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# ── Backpack: history → back ─────────────────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000

# ── Bike: details → history → back → back ────────────────────────────────────
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000

# ── back to Car Keys via two right swipes — card overlay must be readable ────
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- swipe:
    start: "15%, 75%"
    end: "85%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_details"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_card_history"
    timeout: 25000

# ── Car Keys: details -> history -> back -> back, ensure no zoom reset ──────
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- assertNotVisible:
    id: "btn_import"
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
