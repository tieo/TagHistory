appId: io.github.tieo.taghistory
name: Settings — sign out dialog cancel keeps user signed in
---
# Dialog buttons render in a separate window — use text selectors, not IDs.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "btn_sign_out"
    direction: DOWN
    timeout: 25000
    centerElement: true

# Pre: dialog hidden.
- assertNotVisible:
    text: "Sign out\\?"

- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Cancel"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Sign out"
    timeout: 25000

# Cancel via Cancel button.
- tapOn:
    text: "Cancel"
- assertNotVisible:
    text: "Sign out\\?"
- extendedWaitUntil:
    visible:
      id: "btn_sign_out"
    timeout: 25000

# Reopen and cancel again via Android back. The cancel must dismiss the
# dialog without signing out.
- tapOn:
    id: "btn_sign_out"
- extendedWaitUntil:
    visible:
      text: "Sign out\\?"
    timeout: 25000
- back
- assertNotVisible:
    text: "Sign out\\?"
- extendedWaitUntil:
    visible:
      id: "btn_sign_out"
    timeout: 25000

# Still on Settings. Going back to map continues to work — proves we are
# still authenticated and have not been redirected to login.
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Welcome to TagHistory"
