appId: io.github.tieo.taghistory
name: Map — opening details from the list works for all three beacons
---
# Opens DeviceInfo via each row's own details action and verifies the
# rename button renders (proving the device-info ViewModel loaded).
- runFlow:
    file: 00_seed_test_data.yaml

# Car Keys
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-001-aaa"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-001-aaa"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Backpack
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000

# Bike
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-003-ccc"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-003-ccc"
- extendedWaitUntil:
    visible:
      id: "btn_rename"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
