appId: io.github.tieo.taghistory
name: Settings — theme selector has three choices, responds to taps, persists across reopen
---
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000

# All three theme buttons are rendered.
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_light"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_dark"
    timeout: 25000

# Cycle through every choice. After each tap, the screen must still be Settings
# (no crash on theme rewrite recompose).
- tapOn:
    id: "btn_theme_light"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_light"
    timeout: 25000

- tapOn:
    id: "btn_theme_dark"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_dark"
    timeout: 25000

- tapOn:
    id: "btn_theme_system"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000

# Persist test: pick Dark, leave Settings, come back, Dark must still apply
# (the buttons themselves don't expose selected state but the screen keeps
# rendering after a real settings rewrite).
- tapOn:
    id: "btn_theme_dark"
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- tapOn:
    id: "btn_settings"
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_dark"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_light"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000

# Restore default state.
- tapOn:
    id: "btn_theme_system"
- extendedWaitUntil:
    visible:
      id: "btn_theme_system"
    timeout: 25000
