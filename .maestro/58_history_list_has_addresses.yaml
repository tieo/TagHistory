appId: io.github.tieo.taghistory
name: History — expanded list shows item addresses or coords plus times
---
# After expanding the bottom sheet on Today (Car Keys, 3 points), at least
# one history item is visible AND the "At HH:MM" time line renders
# (regex matches anything like "At 12:34" or "At 9:01 PM"). Verifies the
# items are not blank.
- runFlow:
    file: 00_seed_test_data.yaml

- tapOn:
    id: "btn_card_history"
- extendedWaitUntil:
    visible:
      text: "Today"
    timeout: 25000

- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000

# At least one "At HH:MM" timestamp visible (full-string regex). Catches
# UTC-vs-local format bugs and raw-enum/empty output bugs.
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000
# Time format must match exactly two digits, colon, two digits — no seconds,
# no AM/PM mixed in (the formatLocalTime is HH:MM 24-hour locally formatted).
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000

# Three points today seeded — items 0, 1, 2 all present.
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000

- extendedWaitUntil:
    visible:
      text: "distance"
    timeout: 25000

# Day-prev to Yesterday — items still render with the same time format.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Yesterday"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000
# Yesterday for Car Keys has 2 points — items 0 and 1 visible.
- extendedWaitUntil:
    visible:
      id: "history_item_1"
    timeout: 25000

# Older bucket (3 days ago, 1 point) — date label is YYYY-MM-DD.
- tapOn:
    id: "btn_day_prev"
    optional: true
- extendedWaitUntil:
    visible:
      text: ".*\\d\\d\\d\\d.*"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "history_item_0"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: ".*\\d+:\\d\\d.*"
    timeout: 25000

- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    text: "Yesterday"
