appId: io.github.tieo.taghistory
name: History — open-close ten times in a row, app stays alive
---
# Hammers navigation: open a row's history, back to map, ten rounds.
# After each round the map screen still has btn_settings visible.
# Catches memory leaks, ViewModel re-init storms, nav-stack corruption.
- runFlow:
    file: 00_seed_test_data.yaml

- repeat:
    times: 10
    commands:
      - tapOn:
          id: "btn_card_history_test-beacon-001-aaa"
      - extendedWaitUntil:
          visible:
            id: "btn_day_prev"
          timeout: 25000
      - back
      - extendedWaitUntil:
          visible:
            id: "btn_settings"
          timeout: 25000

# List intact after 10 round-trips.
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000

# 10 more rounds on Backpack's row.
- repeat:
    times: 10
    commands:
      - tapOn:
          id: "btn_card_history_test-beacon-002-bbb"
      - extendedWaitUntil:
          visible:
            id: "btn_day_prev"
          timeout: 25000
      - back
      - extendedWaitUntil:
          visible:
            id: "btn_settings"
          timeout: 25000

- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Bike"
    timeout: 25000
