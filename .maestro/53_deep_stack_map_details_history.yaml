appId: io.github.tieo.taghistory
name: Navigation — Map -> Details -> History, three back-presses lands on Map
---
# Drills three levels deep: Map -> DeviceInfo -> History. Verifies that the
# back-stack has exactly three entries (one back from history -> details,
# another back -> map). Catches stack desync.
- runFlow:
    file: 00_seed_test_data.yaml

# Map -> Details
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 15000
- assertNotVisible:
    id: "btn_settings"

# Details -> History (via the View history button on DeviceInfo)
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_settings"

# History -> Details
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 15000
- assertNotVisible:
    id: "btn_settings"

# Details -> Map
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Car Keys"
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_day_prev"

# Repeat with Backpack to ensure the depth holds across pager swipes.
- swipe:
    start: "85%, 75%"
    end: "15%, 75%"
    duration: 400
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 15000
- tapOn:
    id: "btn_card_details"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 15000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_day_prev"
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 15000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_settings"
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 15000
- assertVisible:
    text: "Backpack"
- assertNotVisible:
    text: "Car Keys"
