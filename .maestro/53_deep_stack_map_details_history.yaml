appId: io.github.tieo.taghistory
name: Navigation — Map -> Details -> History, three back-presses lands on Map
---
# Drills three levels deep: Map -> DeviceInfo -> History. Verifies that the
# back-stack has exactly three entries (one back from history -> details,
# another back -> map). Catches stack desync.
- runFlow:
    file: 00_seed_test_data.yaml

# Map -> Details
- tapOn:
    id: "btn_card_details.*"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"

# Details -> History (via the View history button on DeviceInfo)
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_settings"

# History -> Details
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"

# Details -> Map
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Car Keys"
    timeout: 25000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_day_prev"

# Repeat with Backpack to ensure the depth holds for other rows.
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- swipe:
    start: "50%, 88%"
    end: "50%, 55%"
    duration: 400
- extendedWaitUntil:
    visible:
      id: "tag_row_test-beacon-002-bbb"
    timeout: 25000
- tapOn:
    id: "btn_card_details_test-beacon-002-bbb"
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- assertNotVisible:
    id: "btn_settings"
- assertNotVisible:
    id: "btn_day_prev"
- tapOn:
    id: "btn_view_history"
- extendedWaitUntil:
    visible:
      id: "btn_day_prev"
    timeout: 25000
- assertNotVisible:
    id: "btn_view_history"
- assertNotVisible:
    id: "btn_settings"
- back
- extendedWaitUntil:
    visible:
      id: "btn_view_history"
    timeout: 25000
- back
- extendedWaitUntil:
    visible:
      id: "btn_settings"
    timeout: 25000
- extendedWaitUntil:
    visible:
      text: "Backpack"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "btn_refresh_all"
    timeout: 25000
