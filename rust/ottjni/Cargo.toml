[package]
name = "ottjni"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "JNI bridge between TagHistory (Android) and omnisette (Rust anisette generator)"
license = "MPL-2.0"

[lib]
name = "ottjni"
crate-type = ["cdylib", "rlib"]

[dependencies]
omnisette = { path = "../omnisette" }
jni = "0.21"
log = "0.4"
thiserror = "2"
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
tempfile = "3"
