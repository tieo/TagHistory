[package]
name = "ottjni"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "JNI bridge between TagHistory and Apple's macOS CoreADI under Unicorn (adi-core)"
license = "MPL-2.0"

[lib]
name = "ottjni"
crate-type = ["cdylib", "rlib"]

[dependencies]
adi-core = { path = "../adi-core" }
jni = "0.21"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
