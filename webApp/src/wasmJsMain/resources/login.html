<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in · TagHistory</title>
    <link rel="manifest" href="manifest.webmanifest">
    <!--
        The Apple sign-in as a plain page. Password managers fill and save a
        real form in the document; fields drawn on the app's canvas are
        invisible to them. The page talks to the same /api/login endpoints the
        app's own login screen uses and opens the app once the server holds an
        Apple session.
    -->
    <script>
        // Same theme choice as the app: its override in localStorage, else the system.
        const stored = localStorage.getItem("use_dark_theme");
        const dark = stored === null ? matchMedia("(prefers-color-scheme: dark)").matches : stored === "true";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
    </script>
    <style>
        /* Material 3 baseline schemes, as the app's Compose theme uses them. */
        :root[data-theme=light] {
            --surface: #fef7ff; --on-surface: #1d1b20; --on-surface-variant: #49454f; --outline: #79747e;
            --outline-variant: #cac4d0; --primary: #6750a4; --on-primary: #ffffff;
            --primary-container: #eaddff; --on-primary-container: #21005d; --error: #b3261e;
            --container: #f3edf7;
        }
        :root[data-theme=dark] {
            --surface: #141218; --on-surface: #e6e0e9; --on-surface-variant: #cac4d0; --outline: #938f99;
            --outline-variant: #49454f; --primary: #d0bcff; --on-primary: #381e72;
            --primary-container: #4f378b; --on-primary-container: #eaddff; --error: #f2b8b5;
            --container: #211f26;
        }
        html, body { margin: 0; min-height: 100%; background: var(--surface); color: var(--on-surface); }
        body { font-family: Roboto, system-ui, -apple-system, sans-serif; }
        main { box-sizing: border-box; max-width: 480px; margin: 0 auto; padding: 64px 24px 24px;
            display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .hero { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
            background: var(--primary-container); color: var(--on-primary-container); }
        h1 { margin: 8px 0 0; font-size: 24px; font-weight: 600; text-align: center; }
        .lead { margin: 0 0 12px; font-size: 14px; color: var(--on-surface-variant); text-align: center; }
        form, .methods { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        input { box-sizing: border-box; width: 100%; height: 56px; padding: 0 16px; border: 1px solid var(--outline);
            border-radius: 4px; background: transparent; color: var(--on-surface); font: inherit; font-size: 16px; outline: none; }
        input::placeholder { color: var(--on-surface-variant); }
        input:focus { border: 2px solid var(--primary); padding: 0 15px; }
        input.code { text-align: center; letter-spacing: 12px; font-size: 24px; }
        button { height: 48px; border-radius: 24px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
        button.filled { border: none; background: var(--primary); color: var(--on-primary); }
        button.outlined { border: 1px solid var(--outline); background: transparent; color: var(--primary); padding: 0 24px; }
        button:disabled { cursor: default; opacity: 0.38; }
        .method { display: flex; align-items: center; gap: 16px; width: 100%; height: auto; padding: 16px;
            border: none; border-radius: 12px; background: var(--container); color: var(--on-surface);
            font-weight: 500; text-align: left; }
        .error { margin: 0; font-size: 13px; color: var(--error); text-align: center; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <div class="hero" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
    </div>
    <h1 id="title">Welcome to TagHistory</h1>
    <p class="lead" id="lead">Sign in with your Apple ID to fetch AirTag locations.</p>

    <form id="credentials" method="post" action="#">
        <input id="username" name="username" type="email" autocomplete="username" required
               placeholder="Apple ID email or phone" autocapitalize="off" spellcheck="false">
        <input id="password" name="password" type="password" autocomplete="current-password" required
               placeholder="Password">
        <button id="login" class="filled" type="submit">Log in</button>
    </form>

    <div class="methods" id="methods" hidden></div>

    <form id="code-form" method="post" action="#" hidden>
        <input id="code" class="code" name="code" autocomplete="one-time-code" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6" required>
        <button id="verify" class="filled" type="submit">Verify</button>
    </form>

    <p class="error" id="error" hidden></p>
    <button id="restart" class="outlined" type="button" hidden>Start over</button>
</main>
<script>
    const $ = (id) => document.getElementById(id);
    let chosen = null;

    async function api(path, body) {
        const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        });
        const text = await response.text();
        if (!response.ok) {
            let message = text || response.statusText;
            try { message = JSON.parse(text).message || message; } catch {}
            throw new Error(message);
        }
        return text ? JSON.parse(text) : null;
    }

    function show(step) {
        $("credentials").hidden = step !== "credentials";
        $("methods").hidden = step !== "methods";
        $("code-form").hidden = step !== "code";
        $("restart").hidden = step === "credentials";
        $("error").hidden = true;
        if (step === "credentials") {
            $("title").textContent = "Welcome to TagHistory";
            $("lead").textContent = "Sign in with your Apple ID to fetch AirTag locations.";
        } else if (step === "methods") {
            $("title").textContent = "Verify it's you";
            $("lead").textContent = "Choose where Apple sends the code.";
        } else {
            $("title").textContent = "Enter verification code";
            $("lead").textContent = "Sent via " + describe(chosen);
            $("code").value = "";
            $("code").focus();
        }
    }

    function fail(error) {
        $("error").textContent = error.message || String(error);
        $("error").hidden = false;
    }

    function describe(method) {
        return method.kind === "SMS" ? "SMS " + (method.phoneNumber || "") : "Trusted device";
    }

    async function busy(button, label, work) {
        const idle = button.textContent;
        button.disabled = true;
        button.textContent = label;
        try { await work(); } catch (e) { fail(e); } finally {
            button.disabled = false;
            button.textContent = idle;
        }
    }

    // Leaves for the app; the server now holds the Apple session.
    function finish() { location.replace("./"); }

    function next(response) {
        if (response.loggedIn) return finish();
        $("methods").replaceChildren(...response.methods.map((method) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "method";
            button.textContent = describe(method);
            button.onclick = () => busy(button, "Sending…", async () => {
                await api("api/login/2fa/request", { method });
                chosen = method;
                show("code");
            });
            return button;
        }));
        show("methods");
    }

    $("credentials").addEventListener("submit", (event) => {
        event.preventDefault();
        busy($("login"), "Logging in…", async () =>
            next(await api("api/login", { email: $("username").value.trim(), password: $("password").value })));
    });

    $("code-form").addEventListener("submit", (event) => {
        event.preventDefault();
        busy($("verify"), "Verifying…", async () =>
            next(await api("api/login/2fa/submit", { method: chosen, code: $("code").value })));
    });

    $("code").addEventListener("input", () => {
        $("code").value = $("code").value.replace(/\D/g, "").slice(0, 6);
        if ($("code").value.length === 6) $("code-form").requestSubmit();
    });

    $("restart").addEventListener("click", () => show("credentials"));

    // Already signed in: nothing to do here.
    fetch("api/status").then((r) => r.json()).then((s) => { if (s.signedIn) finish(); }).catch(() => {});
</script>
</body>
</html>
